# XcodeGen spec for the Accessicook iPhone app. The CI workflow runs `xcodegen generate`;
# locally: brew install xcodegen && xcodegen generate
name: Accessicook
options:
  bundleIdPrefix: com.thompsonoffice
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Accessicook:
    type: application
    platform: iOS
    sources:
      - path: Accessicook
    settings:
      base:
        PRODUCT_NAME: Accessicook
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.accessicook
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Accessicook
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  AccessicookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AccessicookTests
    dependencies:
      - target: Accessicook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.accessicook.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Accessicook.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Accessicook"
        BUNDLE_LOADER: "$(TEST_HOST)"
  AccessicookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AccessicookUITests
    dependencies:
      - target: Accessicook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thompsonoffice.accessicook.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Accessicook
schemes:
  Accessicook:
    build:
      targets:
        Accessicook: all
        AccessicookTests: [test]
        AccessicookUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AccessicookTests
        - AccessicookUITests
    archive:
      config: Release
