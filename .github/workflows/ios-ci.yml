# Builds Accessicook for the iOS Simulator and runs the unit tests, UI tests and accessibility audits.
# No signing, no upload. Runs on GitHub-hosted macOS (private repos use the account's included
# Actions minutes; macOS minutes count 10x).
# Pull requests are included so a branch can go green before it is merged. Pushes to main
# run the same job.
name: iOS build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-14 is used because hosted macos-15 arm64 runners were not being assigned.
    runs-on: macos-14
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Use the newest installed Xcode
        run: |
          shopt -s nullglob
          candidates=(/Applications/Xcode_*.app)
          if [ ${#candidates[@]} -eq 0 ]; then
            XCODE=/Applications/Xcode.app
          else
            XCODE=$(printf '%s\n' "${candidates[@]}" | sort -V | tail -1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Check bundled cookbook JSON is current
        run: |
          python3 tools/export_cookbook.py
          git diff --exit-code -- Accessicook/Resources/accessicook-data.json

      - name: Generate the Xcode project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices available | grep "$UDID"

      - name: Build and run tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Accessicook.xcodeproj \
            -scheme Accessicook \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/Accessicook.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee build/xcodebuild.log | xcbeautify --renderer github-actions

      - name: Test summary
        if: always()
        run: |
          if [ -d build/Accessicook.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/Accessicook.xcresult --compact | tee build/test-summary.json || true
            xcrun xcresulttool get test-results tests --path build/Accessicook.xcresult --compact > build/test-list.json || true
          fi
          grep -h "Accessibility audit" build/xcodebuild.log > build/accessibility-audit.txt || true
          cat build/accessibility-audit.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Accessicook-test-results
          path: |
            build/Accessicook.xcresult
            build/xcodebuild.log
            build/test-summary.json
            build/test-list.json
            build/accessibility-audit.txt
          if-no-files-found: warn
